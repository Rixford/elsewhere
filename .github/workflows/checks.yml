name: Checks
on: [push, pull_request]
jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install html5lib==1.1 tinycss2==1.4.0
      - run: python -m unittest -v test_core
      - run: node test_ui.cjs
      - run: node --check web/app.js
      - run: node --check web/page-controller.js
