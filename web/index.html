<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elsewhere</title><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script></head>
<body>
  <header id="chrome">
    <div class="tabbar"><div class="wordmark" title="Elsewhere — an imagination browser"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18V6h14M5 12h11M11 18h8"/></svg><span>elsewhere</span></div><div id="tabs" role="tablist" aria-label="Open tabs"></div><button id="new-tab" class="icon" title="New tab (Ctrl+T)" aria-label="New tab">+</button><div class="tab-spacer"></div><span class="local-badge"><i></i><span id="mode-label">LOCAL</span></span></div>
    <div class="toolbar">
      <button id="back" class="icon" title="Back (Alt+Left)" aria-label="Back"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6M8 12h12"/></svg></button>
      <button id="forward" class="icon" title="Forward (Alt+Right)" aria-label="Forward"><svg viewBox="0 0 24 24"><path d="m10 6 6 6-6 6M16 12H4"/></svg></button>
      <button id="reload" class="icon" title="Reload saved page (Ctrl+R)" aria-label="Reload"><svg viewBox="0 0 24 24"><path d="M19 10a7 7 0 1 0-1 8M19 4v6h-6"/></svg></button>
      <form id="address-form" autocomplete="off"><span class="address-symbol" aria-hidden="true">✧</span><input id="address" aria-label="Imagine an address or an idea" placeholder="Enter an address, an idea, anywhere…" spellcheck="false" maxlength="1200"><span id="imagined-label" hidden>IMAGINED</span><button id="go" title="Imagine" aria-label="Imagine">↵</button></form>
      <button id="reimagine" class="reimagine" title="Generate a new interpretation">✧ <span>Reimagine</span></button>
      <button id="history-button" class="icon" title="History" aria-label="History"><svg viewBox="0 0 24 24"><path d="M4 11a8 8 0 1 1 1 6M4 5v6h6M12 7v5l3 2"/></svg></button>
      <button id="bookmark" class="icon" title="Bookmark this page (Ctrl+D)" aria-label="Bookmark this page" disabled>☆</button>
      <button id="bookmarks-button" class="icon" title="Bookmarks" aria-label="Bookmarks">▤</button>
      <button id="settings-button" class="icon" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M5 4v16M12 4v16M19 4v16M2 8h6M9 15h6M16 9h6"/></svg></button>
    </div>
  </header>
  <main id="viewport">
    <div id="blank" aria-label="Empty page"></div>
    <iframe id="page" title="Imagined website" sandbox="allow-scripts allow-forms" referrerpolicy="no-referrer" hidden></iframe>
    <div id="loading" hidden><div class="orbit"><i></i><i></i><i></i></div><h1>Going elsewhere.</h1><p id="loading-stage">Imagining your page</p><small id="loading-detail"></small></div>
    <div id="error" role="alert" hidden><span class="error-symbol">↗</span><h2>This path hasn’t formed yet.</h2><p id="error-message"></p><button id="retry" class="primary">Try again</button></div>
    <div id="review-chip" hidden><span class="spinner"></span><span id="review-stage"></span></div>
  </main>
  <iframe id="validation-frame" title="Layout validation" sandbox="allow-scripts allow-forms" tabindex="-1" aria-hidden="true"></iframe>
  <footer><div class="engine-status"><i id="engine-dot"></i><span id="engine-status">Loading local model…</span></div><span id="page-status">A blank page. An open possibility.</span><button id="details-button" hidden>Page details ↗</button><button id="stop" hidden>■ Stop</button></footer>
  <aside id="panel" hidden><div class="panel-header"><h2 id="panel-title"></h2><button id="close-panel" class="icon" aria-label="Close panel">×</button></div><div id="panel-content"></div></aside>
  <div id="toast" role="status" hidden></div>
</body></html>
